<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentic engineering · jessica black</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1c1c2b;
    --surface: #181825;
    --surface-2: #313244;
    --line: #45475a;
    --bone: #cdd6f4;
    --grey: #9399b2;
    --grey-dim: #6c7086;
    --amber: #cba6f7;
    --amber-dim: #9b7ac4;
    --term-ok: #a6e3a1;
    --term-bad: #f38ba8;
    --term-info: #89b4fa;

    --display: "Archivo Expanded", sans-serif;
    --body: "Archivo", sans-serif;
    --mono: "JetBrains Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--bone);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, rgba(203,166,247,0.05), transparent 55%),
                radial-gradient(140% 120% at 50% 120%, rgba(0,0,0,0.55), transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  /* ---------- deck chrome ---------- */
  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 32px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--grey-dim);
    z-index: 5;
  }
  .hud .brand { color: var(--grey); }
  .hud .brand b { color: var(--bone); font-weight: 500; }
  .hud .count b { color: var(--amber); font-weight: 700; }

  .progress {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    display: flex;
    gap: 2px;
    padding: 0 0;
    z-index: 5;
    background: transparent;
  }
  .progress .seg {
    flex: 1;
    background: var(--line);
    transition: background 0.35s ease;
  }
  .progress .seg.done { background: var(--amber-dim); }
  .progress .seg.here { background: var(--amber); }

  /* ---------- slides ---------- */
  .deck { position: relative; height: 100%; z-index: 2; }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: clamp(56px, 8vw, 130px);
    padding-top: clamp(80px, 9vw, 150px);
    opacity: 0;
  }
  .slide.active {
    display: flex;
    animation: rise 0.42s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: clamp(11px, 1.1vw, 14px);
    letter-spacing: 0.12em;
    text-transform: lowercase;
    color: var(--amber);
    margin-bottom: clamp(22px, 3vw, 40px);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow .tick { color: var(--grey-dim); }
  .eyebrow .label { color: var(--grey); }

  .statement {
    font-family: var(--display);
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.01em;
    font-size: clamp(2.3rem, 6.2vw, 5.6rem);
    max-width: 18ch;
  }
  .statement.sm { font-size: clamp(2rem, 4.6vw, 4rem); max-width: 22ch; }
  .statement em { color: var(--amber); font-style: normal; }

  .body {
    font-size: clamp(1.05rem, 1.7vw, 1.5rem);
    line-height: 1.5;
    color: var(--grey);
    max-width: 46ch;
    margin-top: clamp(24px, 3vw, 40px);
    font-weight: 400;
  }
  .body strong { color: var(--bone); font-weight: 600; }
  .body .hot { color: var(--amber); font-weight: 600; }

  /* ---------- title slide ---------- */
  .title-eyebrow {
    font-family: var(--mono);
    font-size: clamp(12px, 1.3vw, 15px);
    color: var(--grey);
    letter-spacing: 0.04em;
    margin-bottom: clamp(28px, 4vw, 48px);
  }
  .title-eyebrow .prompt { color: var(--amber); }
  .title-meta {
    font-family: var(--mono);
    font-size: clamp(13px, 1.3vw, 15px);
    color: var(--grey);
    margin-top: clamp(30px, 4vw, 50px);
    letter-spacing: 0.03em;
  }
  .title-meta .sep { color: var(--grey-dim); padding: 0 8px; }

  /* ---------- count slide ---------- */
  .count-grid {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    column-gap: clamp(18px, 2.5vw, 40px);
    row-gap: clamp(20px, 3vw, 40px);
    align-items: center;
  }
  .count-nums-left { display: flex; align-items: center; gap: clamp(12px, 1.8vw, 30px); }
  .count-unit { display: inline-flex; align-items: center; gap: clamp(10px, 1.5vw, 22px); }
  .glyph { display: block; flex: none; }
  .glyph.human { width: clamp(1.5rem, 3.4vw, 2.9rem); color: var(--grey-dim); }
  .glyph.bot { width: clamp(2.4rem, 6vw, 5.2rem); color: var(--amber); }
  .count-from {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 4.5rem);
    color: var(--grey-dim);
    line-height: 1;
  }
  .count-arrow { font-family: var(--mono); font-size: clamp(1.4rem, 3vw, 2.6rem); color: var(--grey-dim); }
  .count-mid {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(3rem, 9vw, 8rem);
    color: var(--amber);
    line-height: 0.85;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    transition: color 0.5s ease;
  }
  .slide.stage2-on .count-mid { color: var(--amber-dim); }
  .count-to {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(4rem, 13vw, 11rem);
    color: var(--amber);
    line-height: 0.85;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .count-txt { align-self: start; }
  .count-txt .body { margin-top: clamp(10px, 1.5vw, 16px); max-width: 34ch; }
  .count-caption {
    font-family: var(--mono);
    font-size: clamp(12px, 1.3vw, 15px);
    letter-spacing: 0.1em;
    color: var(--grey);
  }
  .count-grid .stage2 {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .slide.stage2-on .count-grid .stage2 { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .count-grid .stage2 { transform: none; transition: opacity 0.2s ease; }
  }

  /* ---------- card row ---------- */
  .cardrow {
    display: flex;
    gap: clamp(16px, 2vw, 26px);
    margin-top: clamp(24px, 3vw, 38px);
    max-width: 1080px;
  }
  .card {
    flex: 1 1 0;
    border: 1px solid var(--line);
    border-top: 2px solid var(--amber);
    background: var(--surface);
    padding: clamp(18px, 2.2vw, 28px) clamp(18px, 2.2vw, 26px);
  }
  .card .tag {
    font-family: var(--mono);
    font-size: clamp(11px, 1.1vw, 13px);
    letter-spacing: 0.1em;
    color: var(--amber);
    margin-bottom: 14px;
  }
  .card .title {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.1rem, 1.8vw, 1.55rem);
    line-height: 1.15;
    color: var(--bone);
    margin-bottom: 10px;
  }
  .card .line {
    font-size: clamp(0.95rem, 1.3vw, 1.15rem);
    line-height: 1.5;
    color: var(--grey);
  }
  .cardrow .flow {
    flex: none;
    align-self: center;
    font-family: var(--mono);
    font-size: clamp(1.2rem, 2vw, 1.7rem);
    color: var(--amber-dim);
  }

  /* ---------- quote slide ---------- */
  .quote-mark {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(3rem, 6vw, 5rem);
    line-height: 0.6;
    color: var(--amber);
    margin-bottom: clamp(10px, 1.5vw, 18px);
  }
  .quote {
    font-size: clamp(1.35rem, 2.6vw, 2.3rem);
    line-height: 1.35;
    color: var(--bone);
    font-weight: 500;
    max-width: 36ch;
  }
  .quote-attr {
    font-family: var(--mono);
    font-size: clamp(12px, 1.3vw, 15px);
    color: var(--grey);
    letter-spacing: 0.04em;
    margin-top: clamp(18px, 2.5vw, 30px);
  }

  /* ---------- terminal cast ---------- */
  .casts { display: flex; gap: 22px; flex-wrap: wrap; margin-top: clamp(18px, 2.4vw, 32px); }
  .term {
    flex: 1 1 0;
    min-width: 300px;
    border: 1px solid var(--line);
    background: #11111b;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 50px -30px rgba(0,0,0,0.9);
  }
  .term-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .term-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .term-bar .path { font-family: var(--mono); font-size: 11px; color: var(--grey-dim); margin-left: 6px; }
  .term-bar .badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--amber);
    border: 1px solid var(--amber-dim);
    border-radius: 3px;
    padding: 2px 7px;
  }
  .term-body {
    font-family: var(--mono);
    font-size: clamp(11px, 1.05vw, 13.5px);
    line-height: 1.7;
    padding: 18px 18px 22px;
    color: var(--grey);
    white-space: pre-wrap;
  }
  .term-body .p { color: var(--amber); }
  .term-body .ok { color: var(--term-ok); }
  .term-body .bad { color: var(--term-bad); }
  .term-body .info { color: var(--term-info); }
  .term-body .dim { color: var(--grey-dim); }
  .term-body .agent { color: var(--bone); }
  .cursor {
    display: inline-block;
    width: 8px; height: 1.05em;
    background: var(--amber);
    vertical-align: text-bottom;
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .casts.solo .term { max-width: 780px; }

  /* ---------- objections grid ---------- */
  .obj-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(18px, 2.2vw, 30px);
    margin-top: clamp(22px, 3vw, 38px);
    max-width: 60ch;
  }
  .obj {
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .obj .q {
    font-family: var(--mono);
    font-size: clamp(12px, 1.2vw, 14px);
    color: var(--amber);
    margin-bottom: 8px;
  }
  .obj .a {
    font-size: clamp(0.95rem, 1.3vw, 1.12rem);
    color: var(--grey);
    line-height: 1.45;
  }
  .obj .a b { color: var(--bone); font-weight: 600; }

  /* ---------- list preview ---------- */
  .preview {
    font-family: var(--mono);
    margin-top: clamp(24px, 3vw, 38px);
    max-width: 50ch;
  }
  .preview .row {
    display: flex;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    color: var(--grey);
    align-items: baseline;
  }
  .preview .row .n { color: var(--grey-dim); font-size: 0.8em; min-width: 2ch; }
  .preview .row .t { color: var(--bone); }
  .preview .row .arrow { color: var(--amber); margin-left: auto; }

  .preview.links { max-width: 62ch; }
  .preview.links .t a { color: var(--bone); text-decoration: none; border-bottom: 1px solid var(--amber-dim); }
  .preview.links .t a:hover { color: var(--amber); border-bottom-color: var(--amber); }
  .preview.links .arrow { color: var(--grey); }

  /* ---------- speaker notes ---------- */
  .notes {
    position: fixed;
    left: 24px;
    bottom: 24px;
    max-width: min(460px, 60vw);
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 2px solid var(--amber);
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    color: var(--grey);
    z-index: 6;
    display: none;
    white-space: pre-wrap;
  }
  .notes.on { display: block; }
  .notes .notes-tag {
    color: var(--amber);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 6px;
  }

  /* ---------- nav hint ---------- */
  .navhint {
    position: fixed;
    bottom: 16px;
    right: 24px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--grey-dim);
    z-index: 5;
    opacity: 0.55;
  }
  .navhint kbd {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--grey);
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1000px) {
    .cardrow { flex-direction: column; }
    .cardrow .flow { transform: rotate(90deg); align-self: flex-start; margin-left: 18px; }
  }

  @media (max-width: 720px) {
    .obj-grid { grid-template-columns: 1fr; }
    .casts { flex-direction: column; }
    .navhint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide.active { animation: none; }
    .cursor { animation: none; }
  }

  /* ---------- print / pdf export ---------- */
  @media print {
    @page { size: 1280px 720px; margin: 0; }
    html, body { overflow: visible; height: auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .hud, .progress, .navhint, .notes { display: none !important; }
    .deck { height: auto; }
    .slide {
      position: relative;
      display: flex !important;
      opacity: 1 !important;
      animation: none !important;
      width: 1280px;
      height: 720px;
      page-break-after: always;
      break-after: page;
      inset: auto;
    }
    body::before { position: absolute; }
    .cursor { animation: none; }
    .count-grid .stage2 { opacity: 1 !important; transform: none !important; }
    .count-mid { color: var(--amber-dim) !important; }
  }
</style>
</head>
<body>

<div class="hud">
  <div class="brand"><b>agentic engineering</b> · jessica black</div>
  <div class="count">slide <b id="cur">01</b> / <span id="total">00</span></div>
</div>

<div class="deck" id="deck"></div>

<div class="notes" id="notes"></div>
<div class="progress" id="progress"></div>
<div class="navhint"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>n</kbd> notes · <kbd>f</kbd> fullscreen · <kbd>p</kbd> then print = pdf</div>

<script>
/* ==========================================================================
   EDIT SLIDES HERE. each object below is one slide, rendered in order.
   delete a slide by deleting its object; reorder by moving it. slide count,
   numbering, and the progress bar all update automatically.

   text fields accept inline html: <em> = amber accent (in headlines),
   <strong> = bright emphasis (in body text).

   slide types and their fields:
     title     { prompt, statement, meta }
     statement { section: [tick, label], h, size: 'sm' (optional), body (optional) }
     list      { section, h, size, rows: [{ n, t, arrow (optional) }], body (optional) }
     cards     { section, h, size, cards: [{ tag, title, line }], flow: true (optional,
                 draws → between cards for a timeline), body (optional) }
     quote     { section, quote, attribution, body (optional) }
     count     { section, beats: [{ to, caption, body }, { to, caption, body }] }
                 // two-beat counter: 5 -> beat1 -> beat2. entering the slide
                 // animates 5 -> beat1 with beat1's text on the left. the next
                 // → reveals an arrow and the second number (animating from
                 // beat1's value) with beat2's text aligned under it. ← steps
                 // back a beat before leaving the slide.
     terminal  { section, h, size, solo (optional), terms: [{ path, badge, body }] }
     grid      { section, items: [{ q, a }] }
     links     { section, h, rows: [{ href, text, desc }], meta }

   any slide can also have  notes: '...'  (speaker notes, toggled with n).
   ========================================================================== */

const SLIDES = [

  {
    type: 'title',
    prompt: '~/talks $ ./agentic-engineering',
    statement: 'agentic engineering',
    meta: 'jessica black <span class="sep">·</span> talk @ fossa <span class="sep">·</span> 2026',
  },

  {
    type: 'statement',
    section: ['01', 'full disclosure'],
    h: 'some of your skepticism came from <em>me</em>.',
    body: 'i was loudly anti-ai when i worked here, and people trusted my read. it seemed fair to come back and report what changed.',
    notes: 'opus 4.1 / sonnet 4 era. i was a trusted voice across engineering and beyond, and the sentiment here partly traces to me. own it rather than apologize for it: the critiques were accurate at the time.',
  },

  {
    type: 'list',
    section: ['01', 'full disclosure'],
    h: 'the case i made, a year ago.',
    size: 'sm',
    rows: [
      { n: '1', t: 'net neutral at best. babysitting eats the savings.' },
      { n: '2', t: 'the work doesn’t go away. it moves to review.' },
      { n: '3', t: 'confidently wrong is worse than obviously wrong.' },
      { n: '4', t: 'i have to write it to understand it.' },
      { n: '5', t: 'why pay this much for barely an upgrade?' },
    ],
    body: 'i stand by every one of these, for those models.',
    notes: 'these are close to verbatim. deliver them with full conviction; the room should be nodding along before the turn.',
  },

  {
    type: 'statement',
    section: ['01', 'full disclosure'],
    h: 'the studies are <em>right</em>, by the way.',
    size: 'sm',
    body: 'the “about 1.25x, sometimes slower” findings match what i measured on myself in 2025. hold that thought; there’s a much bigger number coming.',
    notes: 'concede fully here. the metr-style results (experienced devs slower on familiar code) are real measurements of unstructured use on earlier models. this concession is what buys the 500 slide its hearing.',
  },

  {
    type: 'cards',
    section: ['02', 'what changed'],
    h: 'then i left, and made myself use it.',
    size: 'sm',
    flow: true,
    cards: [
      {
        tag: 'sonnet 4.5',
        title: 'summoned in my editor',
        line: 'on demand: “add tests like these”, “implement bar like foo”. maybe 1.2x once i learned its quirks.',
      },
      {
        tag: 'opus 4.5 · the step change',
        title: 'moved to claude code',
        line: 'prompt, interview, design doc, then implement in small pieces, testing and reviewing as i went.',
      },
      {
        tag: 'today',
        title: 'hand off to loops',
        line: 'prompt, sometimes a design, then delegate. agents validate end-to-end; most changes merge with little oversight from me.',
      },
    ],
    body: 'no conversion moment. it accumulated.',
    notes: 'sonnet 4.5: summoned in zed on demand (“add more tests like these covering these concerns”, “implement bar like foo but with this change”). opus 4.5: moved to claude code, rarely opened the editor; prompt, interview, design file, implement in small pieces with testing and review along the way. today: i hand things off to loops and mostly just test the app manually. i don’t read most of the code, i rarely review it, and i only open an editor to read design docs. prompt, sometimes a plan, then a /goal handoff; the agent validates itself end-to-end with tools, and external agentic review loops gate the merge.',
  },

  {
    type: 'quote',
    section: ['02', 'what changed'],
    quote: 'i don’t understand how you produce the amount of code you do, and it all works. it’s not ideal code, but it clearly gets the job done. what can you do to help the rest of us level up?',
    attribution: 'eliza · my mentor, cto @ attune · paraphrased',
    body: 'that’s when i stopped wondering whether i was grading my own homework.',
    notes: 'the point is not the compliment. it is external validation from someone i could not dismiss, on work she reviewed herself. this was the moment the multiplier stopped being self-reported.',
  },

  {
    type: 'statement',
    section: ['03', 'the thesis'],
    h: 'the job didn’t disappear. it moved <em>up a level</em>.',
    body: 'i stopped writing lines and started directing systems: guiding agents, unblocking them, owning that the output is correct.',
  },

  {
    type: 'count',
    section: ['03', 'the thesis'],
    beats: [
      {
        to: 50,
        caption: 'concurrent workstreams · today',
        body: 'not an output multiplier. it counts <strong>concurrent workstreams</strong>: five engineers, each directing a handful of agent sessions, already have around 50 tasks in flight.',
      },
      {
        to: 500,
        caption: 'where this is heading',
        body: 'the trajectory only points up. we build for <strong>500</strong>, and the rest of this talk is about what breaks on the way there.',
      },
    ],
    notes: 'two beats: the counter stops at 50 first (today: each engineer directs roughly ten concurrent sessions), then the next press runs it to 500 (the ceiling we build for). skate to where the puck is going. if pressed on the numbers: the claim is workstream count and coordination structure, not output.',
  },

  {
    type: 'statement',
    section: ['03', 'the thesis'],
    h: 'a 500-person org’s problems, on a <em>5-person</em> team.',
    size: 'sm',
    body: 'coordination, review throughput, drift, institutional memory. none of these were engineering problems at 5 humans. all of them are now.',
  },

  {
    type: 'list',
    section: ['03', 'the thesis'],
    h: 'everything else is downstream of <em>one number</em>.',
    size: 'sm',
    rows: [
      { n: 'a', t: 'review doesn’t scale', arrow: '← 500' },
      { n: 'b', t: 'rules aren’t binding', arrow: '← 500' },
      { n: 'c', t: 'memory evaporates', arrow: '← 500' },
      { n: 'd', t: 'debug-by-reading dies', arrow: '← 500' },
    ],
    notes: 'a, b, and c are the next three slides. d comes back later, in what’s still yours (the debugging slide). say that out loud so the room doesn’t wait for a debugging slide that isn’t next.',
  },

  {
    type: 'statement',
    section: ['04', 'what breaks'],
    h: 'you cannot review 500 workstreams <em>by hand</em>.',
    size: 'sm',
    body: 'a human in every pr was the first habit to collapse at agent throughput.',

/* ==========================================================================
   renderer + deck runtime. you shouldn't need to touch anything below here.
   ========================================================================== */

const HUMAN_GLYPH = `<svg class="glyph human" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <circle cx="12" cy="7" r="4"/>
  <path d="M12 13.5c-4.7 0-8.5 3-8.5 6.7V22h17v-1.8c0-3.7-3.8-6.7-8.5-6.7z"/>
</svg>`;
const BOT_GLYPH = `<svg class="glyph bot" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <rect x="11" y="2" width="2" height="4" rx="1"/>
  <circle cx="12" cy="2" r="1.7"/>
  <rect x="3.5" y="7" width="17" height="13" rx="3.5"/>
  <rect x="8" y="11.5" width="2.6" height="4" rx="1" style="fill:var(--bg)"/>
  <rect x="13.4" y="11.5" width="2.6" height="4" rx="1" style="fill:var(--bg)"/>
</svg>`;

function eyebrow(s) {
  if (!s.section) return '';
  const [tick, label] = s.section;
  return `<div class="eyebrow"><span class="tick">${tick}</span>${label ? `<span class="label">${label}</span>` : ''}</div>`;
}
function heading(s) {
  return s.h ? `<h2 class="statement${s.size === 'sm' ? ' sm' : ''}">${s.h}</h2>` : '';
}
function bodyText(s) {
  return s.body ? `<p class="body">${s.body}</p>` : '';
}
function listRows(rows) {
  return rows.map(r =>
    `<div class="row"><span class="n">${r.n}</span><span class="t">${r.t}</span>${r.arrow ? `<span class="arrow">${r.arrow}</span>` : ''}</div>`
  ).join('');
}
function termBlock(t) {
  return `<div class="term">
    <div class="term-bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="path">${t.path}</span>
      <span class="badge">${t.badge}</span>
    </div>
    <div class="term-body">${t.body}</div>
  </div>`;
}

const RENDER = {
  title: s => `
    <div class="title-eyebrow"><span class="prompt">${s.prompt}</span></div>
    <h1 class="statement">${s.statement}</h1>
    <div class="title-meta">${s.meta}</div>`,

  statement: s => eyebrow(s) + heading(s) + bodyText(s),

  list: s => eyebrow(s) + heading(s) + `<div class="preview">${listRows(s.rows)}</div>` + bodyText(s),

  cards: s => eyebrow(s) + heading(s) + `<div class="cardrow">${s.cards.map(c =>
    `<div class="card">${c.tag ? `<div class="tag">${c.tag}</div>` : ''}${c.title ? `<div class="title">${c.title}</div>` : ''}<div class="line">${c.line}</div></div>`
  ).join(s.flow ? '<span class="flow">→</span>' : '')}</div>` + bodyText(s),

  quote: s => eyebrow(s) + `
    <div class="quote-mark">“</div>
    <div class="quote">${s.quote}</div>
    <div class="quote-attr">${s.attribution}</div>` + bodyText(s),

  count: s => {
    const [b1, b2] = s.beats;
    return eyebrow(s) + `
    <div class="count-grid">
      <div class="count-nums-left">
        <span class="count-unit">${HUMAN_GLYPH}<span class="count-from">5</span></span>
        <span class="count-arrow">→</span>
        <span class="count-unit">${BOT_GLYPH}<span class="count-mid" data-bignum1>${b1.to}</span></span>
        <span class="count-arrow stage2">→</span>
      </div>
      <div class="stage2"><span class="count-to" data-bignum2>${b2.to}</span></div>
      <div class="count-txt">
        <div class="count-caption">${b1.caption}</div>
        ${b1.body ? `<p class="body">${b1.body}</p>` : ''}
      </div>
      <div class="count-txt stage2">
        <div class="count-caption">${b2.caption}</div>
        ${b2.body ? `<p class="body">${b2.body}</p>` : ''}
      </div>
    </div>`;
  },

  terminal: s => eyebrow(s) + heading(s) +
    `<div class="casts${s.solo ? ' solo' : ''}">${s.terms.map(termBlock).join('')}</div>`,

  grid: s => eyebrow(s) + heading(s) + `<div class="obj-grid">${s.items.map(o =>
    `<div class="obj"><div class="q">${o.q}</div><div class="a">${o.a}</div></div>`).join('')}</div>`,

  links: s => eyebrow(s) + `<h2 class="statement">${s.h}</h2>
    <div class="preview links">${s.rows.map(r =>
      `<div class="row"><span class="t"><a href="${r.href}">${r.text}</a></span><span class="arrow">${r.desc}</span></div>`).join('')}</div>
    <div class="title-meta">${s.meta}</div>`,
};

const deck = document.getElementById('deck');
SLIDES.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'slide';
  sec.innerHTML = RENDER[s.type](s);
  deck.appendChild(sec);
});

const slides = Array.from(document.querySelectorAll('.slide'));
const total = slides.length;
let i = 0;
let stage = 0;
let notesOn = false;

const prog = document.getElementById('progress');
slides.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; prog.appendChild(s); });
const segs = Array.from(prog.children);
document.getElementById('total').textContent = String(total).padStart(2, '0');

const notesEl = document.getElementById('notes');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let animSeq = 0;
function setNum(el, v) {
  el.dataset.anim = String(++animSeq);
  el.textContent = String(v);
}
function countUp(el, start, end, dur) {
  const id = String(++animSeq);
  el.dataset.anim = id;
  if (reduced) { el.textContent = String(end); return; }
  const t0 = performance.now();
  function frame(t) {
    if (el.dataset.anim !== id) return;
    const k = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 6.5);
    el.textContent = Math.round(start + (end - start) * eased);
    if (k < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function applyStage(animate) {
  const s = SLIDES[i];
  if (s.type !== 'count') return;
  const active = slides[i];
  const [b1, b2] = s.beats;
  active.classList.toggle('stage2-on', stage > 0);
  const n1 = active.querySelector('[data-bignum1]');
  const n2 = active.querySelector('[data-bignum2]');
  if (stage === 0) {
    setNum(n2, b2.to);
    if (animate) countUp(n1, 5, b1.to, 2200);
    else setNum(n1, b1.to);
  } else {
    setNum(n1, b1.to);
    if (animate) countUp(n2, b1.to, b2.to, 2600);
    else setNum(n2, b2.to);
  }
}

function syncNotes() {
  const n = SLIDES[i] && SLIDES[i].notes;
  if (notesOn && n) {
    notesEl.innerHTML = '<span class="notes-tag">notes</span>';
    notesEl.appendChild(document.createTextNode(n));
    notesEl.classList.add('on');
  } else {
    notesEl.classList.remove('on');
  }
}

function show(n) {
  i = Math.max(0, Math.min(total - 1, n));
  stage = 0;
  slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
  segs.forEach((s, idx) => {
    s.classList.toggle('done', idx < i);
    s.classList.toggle('here', idx === i);
  });
  document.getElementById('cur').textContent = String(i + 1).padStart(2, '0');
  applyStage(true);
  syncNotes();
}

function next() {
  const s = SLIDES[i];
  if (s.type === 'count' && stage < s.beats.length - 1) { stage++; applyStage(true); return; }
  show(i + 1);
}
function prev() {
  const s = SLIDES[i];
  if (s.type === 'count' && stage > 0) { stage--; applyStage(false); return; }
  show(i - 1);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { show(0); }
  else if (e.key === 'End') { show(total - 1); }
  else if (e.key === 'n' || e.key === 'N') { notesOn = !notesOn; syncNotes(); }
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

// click right 60% = next, left 40% = prev (ignore link clicks)
deck.addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  if (e.clientX > window.innerWidth * 0.4) next(); else prev();
});

show(0);
</script>
